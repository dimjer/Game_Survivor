<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0f13">
  <title>Survivor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png"> <!-- иконка на экране «Домой» iPhone (SVG iOS не берёт) -->
  <meta name="apple-mobile-web-app-title" content="Survivor">
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f13; overflow: hidden; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    /* Холст на весь экран, включая зону под часами и полоской «домой» (на iPhone с экрана «Домой») */
    canvas { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
    /* Пиксельный шрифт заголовков и кнопок (Pixelify Sans, лицензия OFL): кириллица с украинскими буквами + латиница */
    @font-face { font-family: 'Pixelify Sans'; font-weight: 400 700; font-display: swap; src: url(fonts/pixelify-cyrillic.woff2) format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: 'Pixelify Sans'; font-weight: 400 700; font-display: swap; src: url(fonts/pixelify-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Прототип: первая ошибка скрипта показывается поверх игры (на телефоне консоли не видно)
    window.addEventListener('error', function (e) {
      if (document.getElementById('err')) return;
      var d = document.createElement('pre');
      d.id = 'err';
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:40px;z-index:9;margin:0;padding:10px;background:#b00020;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;border-radius:8px';
      d.textContent = 'Ошибка: ' + e.message + '\n' + (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno;
      document.body.appendChild(d);
    });
  </script>
  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/uk.js"></script>
  <script src="data.js"></script>
  <script src="levels.js"></script>
  <script src="meta.js"></script>
  <script src="game.js"></script>
  <script src="skin.js"></script>
  <script src="ui.js"></script>
</body>
</html>
