<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0f13">
  <title>Survivor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f13; overflow: hidden; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Прототип: первая ошибка скрипта показывается поверх игры (на телефоне консоли не видно)
    window.addEventListener('error', function (e) {
      if (document.getElementById('err')) return;
      var d = document.createElement('pre');
      d.id = 'err';
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:40px;z-index:9;margin:0;padding:10px;background:#b00020;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;border-radius:8px';
      d.textContent = 'Ошибка: ' + e.message + '\n' + (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno;
      document.body.appendChild(d);
    });
  </script>
  <script src="data.js"></script>
  <script src="levels.js"></script>
  <script src="meta.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
